pagos:
  topic:
    alertas: alertas.seguridad

resilience4j:
  circuitbreaker:
    instances:
      cuentasService:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5000
  retry:
    instances:
      cuentasService:
        max-attempts: 3
        wait-duration: 500ms
