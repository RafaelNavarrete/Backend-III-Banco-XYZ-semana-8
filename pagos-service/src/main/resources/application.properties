server.port=8093
spring.application.name=pagos-service
spring.config.import=optional:configserver:http://localhost:8888
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWK_URI:http://localhost:9000/oauth2/jwks}

spring.kafka.bootstrap-servers=localhost:9092
pagos.topic=pagos.completados

management.endpoints.web.exposure.include=health,info

spring.kafka.producer.properties.max.block.ms=3000

resilience4j.circuitbreaker.instances.cuentasService.sliding-window-size=5
resilience4j.circuitbreaker.instances.cuentasService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.cuentasService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.cuentasService.wait-duration-in-open-state=5000
resilience4j.retry.instances.cuentasService.max-attempts=3
resilience4j.retry.instances.cuentasService.wait-duration=500ms
resilience4j.bulkhead.instances.cuentasService.max-concurrent-calls=5
resilience4j.bulkhead.instances.cuentasService.max-wait-duration=0